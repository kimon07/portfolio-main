<!doctype html><meta charset="utf-8"><title>NESTO validation</title><pre id="result">RUNNING</pre><iframe id="frame" style="width:1440px;height:1000px"></iframe><script>
(async()=>{
const results=[],frame=document.querySelector('#frame'),output=document.querySelector('#result');
const check=(name,pass)=>{results.push((pass?'PASS ':'FAIL ')+name);output.textContent=results.join('\n');};
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const load=url=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentDocument);frame.src=url;});
try{
let doc=await load('../nesto.html');await wait(300);
check('Hero image loaded',doc.querySelector('.cover-image img').naturalWidth>0);
for(const width of [1440,768,390,320]){
frame.style.width=width+'px';await wait(100);
check('Case study no horizontal overflow at '+width,doc.documentElement.scrollWidth<=width);
}
frame.style.width='1440px';await wait(100);
for(const [device,width] of [['pc',1440],['pad',768],['mobile',390]]){
doc.querySelector('[data-device="'+device+'"]').click();await wait(100);
check('Preview viewport '+device,parseInt(doc.querySelector('[data-preview]').style.width)===width);
}
for(const mode of ['list','product','home']){
const nested=doc.querySelector('[data-preview]');
await new Promise(resolve=>{nested.onload=resolve;doc.querySelector('[data-screen="'+mode+'"]').click();});
check('Screen switch '+mode,nested.contentDocument.querySelector('#shop-content').children.length>0);
}
for(const width of [1440,768,390,320]){
frame.style.width=width+'px';
for(const mode of ['home','list','product']){
doc=await load('../nesto-preview.html?screen='+mode);await wait(60);
check(mode+' no horizontal overflow at '+width,doc.documentElement.scrollWidth<=width);
}
}
doc=await load('../nesto-preview.html?screen=list');
doc.querySelector('[data-filter="sofa"]').click();check('Category filter',doc.querySelectorAll('.product-card').length===1);
doc.querySelector('[data-filter="all"]').click();check('All category restores six products',doc.querySelectorAll('.product-card').length===6);
doc=await load('../nesto-preview.html?screen=product');
doc.querySelector('[data-plus]').click();check('Quantity and price update',doc.querySelector('[data-quantity]').textContent==='2'&&doc.querySelector('[data-total]').textContent==='1,920,000원');
doc.querySelector('[data-minus]').click();check('Quantity lower bound',doc.querySelector('[data-minus]').disabled);
frame.style.width='1440px';frame.src='../index.html';await wait(2500);doc=frame.contentDocument;
check('Portfolio has NESTO and AESOP menus',!!doc.querySelector('[data-nesto-open]')&&!!doc.querySelector('[data-menu-route="team"]'));
doc.querySelector('[data-nesto-open]').click();check('NESTO dialog opens',doc.querySelector('[data-nesto-dialog]').open);
doc.querySelector('[data-nesto-close]').click();await wait(60);check('NESTO dialog closes',!doc.querySelector('[data-nesto-dialog]').open);
check('Focus returns to menu',doc.activeElement===doc.querySelector('[data-menu-open]'));
output.textContent=results.join('\n')+'\nDONE';
}catch(error){output.textContent=results.join('\n')+'\nERROR '+error.stack;}
})();
</script>
