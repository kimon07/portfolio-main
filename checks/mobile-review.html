<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobile layout review</title>
<style>body{margin:0;background:#ddd}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap;font:13px/1.6 monospace;margin:20px}</style>
<iframe title="Responsive review"></iframe><pre id="result">RUNNING</pre>
<script>
(async()=>{
  const frame=document.querySelector('iframe'),result=document.querySelector('#result'),params=new URLSearchParams(location.search);
  const rows=[],pause=()=>new Promise(resolve=>setTimeout(resolve,120));
  const load=async(url,width=390,height=844)=>{frame.style.width=width+'px';frame.style.height=height+'px';await new Promise(resolve=>{frame.onload=resolve;frame.src='../'+url;});await pause();return frame.contentDocument;};
  const check=(label,ok)=>{rows.push((ok?'PASS ':'FAIL ')+label);result.textContent=rows.join('\n');};
  const fits=doc=>doc.documentElement.scrollWidth<=doc.documentElement.clientWidth;
  const view=params.get('view');
  if(view){
    const paths={home:'nesto-shop/index.html',menu:'nesto-shop/index.html',list:'nesto-shop/list.html',product:'nesto-shop/product.html?id=1',case:'nesto.html',preview:'nesto.html',portfolio:'index.html'};
    const doc=await load(paths[view],Number(params.get('width')||390),Number(params.get('height')||844));
    if(view==='menu')doc.querySelector('.btn-menu').click();
    if(view==='preview')doc.querySelector('#preview').scrollIntoView();
    if(view==='portfolio')doc.querySelector('[data-menu-open]').click();
    if(params.get('section'))doc.querySelector(params.get('section'))?.scrollIntoView();
    await pause();
    result.textContent=JSON.stringify({width:doc.documentElement.clientWidth,scrollWidth:doc.documentElement.scrollWidth,heading:doc.querySelector('h1')?.textContent},null,2);
    return;
  }
  try{
    for(const width of [320,360,390,430,700,768,1024,1440]){
      for(const url of ['nesto.html','nesto-shop/index.html','nesto-shop/list.html','nesto-shop/product.html?id=1']){
        const doc=await load(url,width);
        check(url+' fits '+width+'px',fits(doc));
        if(!fits(doc))rows.push('  overflow: '+[...doc.querySelectorAll('main *,footer *')].filter(el=>{const r=el.getBoundingClientRect();return r.width&&r.right>width+1&&!el.closest('.n-slides,.n-rail,.preview-viewport,.keyword-strip');}).slice(0,8).map(el=>el.className||el.tagName).join(', '));
        if(url==='nesto.html'){
          const device=width<=700?'mobile':width<=1024?'pad':'pc';
          check('Default preview '+device+' at '+width,doc.querySelector('[data-device="'+device+'"]').getAttribute('aria-pressed')==='true');
          if(width<=700){
            const child=doc.querySelector('[data-preview]');
            check('Mobile preview renders without shrinking at '+width,child.style.transform==='scale(1)'&&child.clientWidth<=width);
          }
        }
      }
    }
    for(const width of [320,390,768]){
      const doc=await load('nesto-shop/index.html',width),win=frame.contentWindow;
      doc.querySelector('.btn-menu').click();await pause();
      const overlay=doc.querySelector('.smart-overlay-menu');
      check('Menu opens at '+width,!overlay.inert&&overlay.classList.contains('on'));
      check('Menu has no horizontal overflow at '+width,overlay.scrollWidth<=width);
      check('Menu targets at least 44px at '+width,[...doc.querySelectorAll('.gnb-smart a,.gnb2depth-smart.on a')].every(a=>a.getBoundingClientRect().height>=44));
      for(const tab of [...doc.querySelectorAll('.gnb-smart>li>a')].slice(1)){
        tab.click();
        check(tab.textContent+' submenu at '+width,doc.querySelectorAll('.gnb2depth-smart.on').length===1&&overlay.scrollWidth<=width);
      }
      doc.querySelector('.btn-menu-close').click();
      check('Menu closes and unlocks scroll at '+width,overlay.inert&&doc.body.style.overflow!=='hidden');
    }
    let doc=await load('nesto.html',390);
    doc.querySelector('[data-device="pc"]').click();
    check('Explicit PC preview retained',doc.querySelector('[data-preview]').style.width==='1440px');
    doc.querySelector('[data-device="mobile"]').click();
    for(const screen of ['list','product','home']){
      doc.querySelector('[data-screen="'+screen+'"]').click();await pause();
      check(screen+' preview and new-window link match',doc.querySelector('[data-preview]').getAttribute('src')===doc.querySelector('.nesto-open-site a').getAttribute('href'));
    }
    doc=await load('index.html',320);await pause();
    doc.querySelector('[data-menu-open]').click();await pause();
    check('Portfolio menu visible at 320px',doc.querySelector('.site-menu').classList.contains('is-open'));
    check('Portfolio menu labels fit',[...doc.querySelectorAll('.site-menu nav a strong')].every(el=>el.getBoundingClientRect().right<=320));
    doc.querySelector('[data-nesto-open]').click();await pause();
    check('NESTO opens from mobile menu',doc.querySelector('[data-nesto-dialog]').open);
    doc.querySelector('[data-nesto-close]').click();
    check('NESTO closes back to portfolio',!doc.querySelector('[data-nesto-dialog]').open);
    result.textContent=rows.join('\n')+'\nDONE';
  }catch(error){result.textContent=rows.join('\n')+'\nERROR '+error.stack;}
})();
</script></html>
