<!doctype html><html><meta charset="utf-8"><title>AESOP responsive review</title><style>html,body{margin:0;background:#e0e4dc}iframe{display:block;border:0;margin:auto;background:white}</style><script>
const params=new URLSearchParams(location.search);const f=document.createElement('iframe');f.width=params.get('width')||402;f.height=params.get('height')||1000;f.src='../aesop/'+(params.get('page')||'about.html');f.onload=()=>{const w=f.contentWindow;const style=w.document.createElement('style');style.textContent='*,*::before,*::after{transition:none!important;animation:none!important}';w.document.head.append(style);w.document.querySelectorAll('.ae-reveal').forEach(e=>e.classList.add('ae-revealed'));if(params.get('scroll'))w.scrollTo({top:Number(params.get('scroll')),behavior:'instant'});if(params.has('menu')){w.document.querySelector('.btn-menu button').click();w.document.querySelector('[data-menu="about"]').click();}};window.onload=()=>document.body.append(f);
</script></html>
